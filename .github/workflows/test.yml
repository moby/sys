name: Test

# Default to 'contents: read', which grants actions to read commits.
#
# If any permission is set, any permission not included in the list is
# implicitly set to "none".
#
# see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.18.x, oldstable, stable]
        platform: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025, macos-15, macos-26]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10 # guardrails timeout for the whole job
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        # Disable caching as we don't have top-level go.sum needed for
        # the cache key, and specifying multiple go.sums is not trivial
        # (see https://github.com/moby/sys/pull/160 for details).
        cache: false
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.14
        # We don't need to run golangci-lint here yet, but
        # there's no way to avoid it, so run it on one module.
        working-directory: ./mountinfo
    - name: Set PACKAGES env
      if: ${{ matrix.go-version == '1.18.x' }}
      run: |
        # Check if the module supports this version of Go.
        go_version="$(go env GOVERSION)"
        go_version="${go_version#go}"
        
        packages=""
        for p in */; do
          [ -f "$p/go.mod" ] || continue
          if (cd "$p" && go list -m -f "{{if gt .GoVersion \"$go_version\"}}ko{{end}}" 2>/dev/null | grep -q ko); then
            echo "::notice::SKIP: github.com/moby/sys/${p%/} requires a more recent version of Go"
          elif ! (cd "$p" && go list -m >/dev/null 2>&1); then
            echo "::notice::SKIP: github.com/moby/sys/${p%/} is not supported by Go ${go_version}"
          else
            packages+="${p%/} "
          fi
        done
        
        if [ -z "$packages" ]; then
          echo "::error::No packages are supported by Go ${go_version}"
          exit 1
        fi

        echo "PACKAGES=${packages}" >> "$GITHUB_ENV"
    - name: go mod tidy
      run: |
        make foreach CMD="go mod tidy"
        git diff --exit-code
    - name: go fix
      run: |
        make foreach CMD="go fix"
        git diff --exit-code
    - name: Lint
      run: make lint
    - name: Cross build
      if: ${{ runner.os == 'Linux' }}
      run: make cross
    - name: Test
      run: |
        uname -a
        make test
    - name: Send to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}  # used to upload coverage reports: https://github.com/moby/buildkit/pull/4660#issue-2142122533

  codespell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # guardrails timeout for the whole job
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: pip install --break-system-packages codespell==v2.4.3
    - run: codespell

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # guardrails timeout for the whole job
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
      with:
        # Report findings as workflow annotations rather than uploading
        # them to the repository's security tab (which needs additional
        # permissions and GitHub Advanced Security to be enabled).
        advanced-security: false
        annotations: true
